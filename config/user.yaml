# ==============================================================================
# MXD 游戏辅助 - 用户配置文件
# ==============================================================================
#
# 说明：
#   - 本文件采用 YAML 格式，支持中文注释，方便阅读和修改
#   - 所有数值均为示例或当前实际值，请根据自身需求调整
#   - 修改后点击 GUI 的「保存配置」按钮即可生效
#   - 坐标区域支持两种格式：
#       1) 百分比 [x%, y%, w%, h%]   值为 0.0~1.0，相对帧宽高，自适应分辨率
#       2) 像素   [x, y, w, h]       整数，基于 reference_width/reference_height 缩放
#
# ==============================================================================

# ==============================================================================
# 窗口设置
# ==============================================================================
window_title: "冒险岛怀旧服"

# 开始/停止快捷键
start_stop_hotkey: "F6"

# ==============================================================================
# 分辨率自适应
# ==============================================================================
# 参考分辨率：截图/框选时的分辨率，所有坐标区域基于此分辨率记录
# 实际运行时会自动缩放到当前窗口分辨率
reference_width: 1368
reference_height: 800

# ==============================================================================
# 性能设置
# ==============================================================================
# 自动打怪目标帧率（每秒处理帧数）
fps: 5

# ==============================================================================
# 模型 / 检测设置
# ==============================================================================
# YOLO 模型文件路径（.pt / .onnx / .exe）
model_path: "E:/pythonProjects/mxd-automation/train/scripts/02_train_yolo/model/best.pt"

# 检测置信度阈值 (0.0~1.0)，越高要求越严格
confidence: 0.5

# 怪物类别名（YOLO 模型中的类别名，多个用逗号分隔）
monster_classes: "monster"

# 地板类别名（用于路径规划）
floor_classes: "floor"

# 绳索类别名（用于攀爬检测）
rope_classes: "rope"

# ==============================================================================
# 自身角色定位
# ==============================================================================
# 角色在脚下显示的名字（用于 OCR 识别自身位置）
self_name: "我是立立"

# HP 条底部到角色脚底的偏移像素（参考分辨率下的值，自动缩放）
self_offset: 85

# ==============================================================================
# HP（血量）检测
# ==============================================================================
# 血条区域（百分比格式 [x%, y%, w%, h%]）
# 以截图左上角为原点，x=0% y=0%，右下角为 x=100% y=100%
hp_region: [0.3675, 0.9740, 0.0791, 0.0234]

# 血条颜色 [R, G, B]（RGB 格式，用于颜色匹配）
hp_color: [201, 88, 88]

# 颜色容差（各通道允许的最大差值，越大颜色匹配越宽松）
hp_tolerance: 20

# 血量阈值 (0.0~1.0)，低于此百分比时自动按下加血键
hp_threshold: 0.6

# 加血快捷键（游戏内的药水/回血按键）
hp_key: "f"

# ==============================================================================
# MP（蓝量）检测
# ==============================================================================
# 蓝条区域（百分比格式 [x%, y%, w%, h%]）
mp_region: [0.4458, 0.9753, 0.0783, 0.0195]

# 蓝条颜色 [R, G, B]（RGB 格式，用于颜色匹配）
mp_color: [3, 130, 231]

# 颜色容差
mp_tolerance: 20

# 蓝量阈值 (0.0~1.0)，低于此百分比时自动按下加蓝键
mp_threshold: 0.6

# 加蓝快捷键
mp_key: "g"

# ==============================================================================
# 战斗设置
# ==============================================================================
# 选中目标键（用于切换攻击目标）
target_key: "tab"

# 技能列表（轮转释放，按顺序依次按下）
#   name:     技能名称（仅用于显示）
#   key:      技能快捷键
#   cooldown: 冷却时间（秒）
skills:
  - name: "技能1"
    key: "x"
    cooldown: 1.0