# 全局默认配置（程序自带，请勿手动修改）
# 运行时用户改动会写入 config/user.json，加载时以此处为底、user.json 覆盖

# ---- 窗口 ----
window:
  title: "冒险岛怀旧服"
  ref_width: 1366         # 坐标标定时的窗口宽度（用于不同分辨率缩放）
  ref_height: 768         # 坐标标定时的窗口高度

# ---- 检测（YOLO）----
detection:
  model_path: ""           # 留空则使用 MockDetector；指向 .pt 文件时启用 YOLO
  confidence: 0.5
  monster_classes: "monster"   # 逗号分隔的怪物类别名
  floor_classes: "floor"       # 地板类别名
  rope_classes: "rope"         # 绳索类别名
  player_classes: "player"     # 其他玩家类别名（自身不靠 YOLO）
  self_name: ""               # 自身角色名（用于脚底名字匹配定位）
  self_offset: 85             # HP条底部到脚底的像素偏移（参考分辨率下）
  fps: 13

# ---- 血量 ----
hp:
  key: "f"
  threshold: 0.99          # HP 比例低于此值则加血
  color: [231, 34, 34]     # RGB
  tolerance: 20
  region: [510, 777, 108, 17]   # [x, y, w, h] 窗口内坐标，运行时框选覆盖

# ---- 蓝量 ----
mp:
  key: "g"
  threshold: 0.3
  color: [3, 130, 232]
  tolerance: 20
  region: [620, 777, 106, 18]

# ---- 战斗 ----
combat:
  target_key: "tab"        # 选中目标按键
  move_to_monster: false   # 检测到怪是否点击移动到怪位置
  skills:
    - name: "技能1"
      key: "1"
      cooldown: 1.0
    - name: "技能2"
      key: "2"
      cooldown: 3.0
    - name: "技能3"
      key: "3"
      cooldown: 8.0

# ---- 热键 ----
hotkey:
  start_stop: "f12"

# ---- 人类模拟（执行层通用参数，新架构预留）----
humanize:
  key_delay_min: 0.02      # 按键按下/抬起间隔（秒）
  key_delay_max: 0.06
  press_cooldown: 1.5      # 同一按键默认冷却（秒）